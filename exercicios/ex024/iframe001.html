<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Iframes</title>
</head>
<body>
    <h1>Testando o uso de um Iframe</h1>
    <p>Acessando o site do <iframe src="https://cursoemvideo.com" frameborder="0"></iframe> para aprender a programar.</p>

    <p>O site do <iframe src="https://www.google.com.br" frameborder="0"></iframe> também é muito legal!</p>

    <!-- É um elemento HTML que permite incorporar outro documento HTML em uma página web. Essencialmente, ele cria um "quadro" dentro da página, onde um conteúdo externo é exibido como se fizesse parte da página original.
     
    Nem todos os sites podem ser utilizados em um iframe-->
</body>
</html>
