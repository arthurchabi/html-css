<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            height: 400px;
            width: 400px;
            border-collapse: collapse;
        }

        td{
            border: 1px solid black;
            text-align: center; /*Alinhamento Horizontal*/
            vertical-align: middle; /*Alinhamento Vertical*/
            padding: 8px;
        }

        .number{
            text-align: right;
        }
    </style>

</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
        Table = Tabela
            Table row = Linha de Tabela
                Table header = Cabeçalho de tabela
                Table data = Dados da tabela 
    -->
    <Table>
        <tr> <!-- Primeira Linha-->
            <td>A1</td>
            <td>B1</td>
            <td class="number">C1</td>
        </tr>

        <tr>  <!-- Segunda Linha-->
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>

        <tr>  <!-- Terceira Linha-->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>

        <tr>  <!-- Quarta Linha-->
            <td>A4</td>
            <td>B4</td>
            <td class="number">C4</td>
        </tr>
    </Table>
</body>
</html>
